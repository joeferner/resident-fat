name: Release

# Publishing to crates.io is permanent -- a version can be yanked but never
# replaced or deleted, and the version number can never be reused -- so this
# never triggers on a branch push. Pushing a `v*` tag is the deliberate act
# that starts a release, and `workflow_dispatch` covers re-running it after a
# failure without moving the tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish to crates.io
    runs-on: ubuntu-latest
    # Declared here, created by hand under Settings -> Environments. Adding
    # yourself as a required reviewer parks the workflow at "waiting for
    # approval" and gives one last look before the irreversible step.
    environment: crates-io
    # `contents: write` is for the GitHub release made after publishing;
    # everything before it only reads the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Both guards below fail the release rather than publishing something
      # that can't be taken back.
      - name: Tag must match the manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      # `CHANGELOG.md`'s heading carries a literal `ReleaseDate` placeholder
      # (the `cargo-release` convention) until the release is actually dated.
      # Publishing with it still in place ships a changelog that says the
      # version was never released.
      - name: Changelog must be dated
        run: |
          if grep -q ReleaseDate CHANGELOG.md; then
            echo "CHANGELOG.md still has the ReleaseDate placeholder" >&2
            exit 1
          fi

      - run: make package

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish

      # After publishing, so a release that failed to publish gets no release
      # page claiming otherwise. `CHANGELOG.md`'s version links point at
      # `/releases/tag/v<version>`, which only resolves once this exists.
      #
      # Tag pushes only: a `workflow_dispatch` re-run has no tag to name the
      # release after, and if the original run got this far the release is
      # already there. The notes are the version's changelog section, cut at
      # the *next* `## [` heading -- see RELEASING.md step 8 for why that is
      # `awk` and not a `sed` range.
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## [$version]" '
            index($0, v) == 1 { inside = 1; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no ## [$version] section" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "resident-fat $version" \
            --notes-file release-notes.md